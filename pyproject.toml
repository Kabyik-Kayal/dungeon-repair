[project]
name = "dungeon-repair"
version = "0.1.0"
description = "Playability verification and intent-preserving repair for procedurally generated lock-and-key dungeons"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dungeon-repair = "dungeon_repair.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dungeon_repair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
